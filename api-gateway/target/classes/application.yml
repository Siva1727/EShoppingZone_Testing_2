server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service-route
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**

        - id: profile-service-route
          uri: lb://PROFILE-SERVICE
          predicates:
            - Path=/api/v1/profiles/**

        - id: product-service-route
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/products/**, /api/v1/merchant/products/**, /api/v1/admin/products/**

        - id: inventory-service-route
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/v1/inventory/**

        - id: cart-service-route
          uri: lb://CART-SERVICE
          predicates:
            - Path=/api/v1/cart/**

        - id: order-service-route
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/v1/orders/**, /api/v1/merchant/orders/**, /api/v1/admin/orders/**

        - id: wallet-service-route
          uri: lb://WALLET-SERVICE
          predicates:
            - Path=/api/v1/wallet/**

        - id: payment-service-route
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/v1/payments/**, /api/v1/refunds/**

        - id: delivery-service-route
          uri: lb://DELIVERY-SERVICE
          predicates:
            - Path=/api/v1/deliveries/**, /api/v1/admin/deliveries/**, /api/v1/agent/deliveries/**

        - id: notification-service-route
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/notifications/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

management:
  endpoints:
    web:
      exposure:
        include: health,info
